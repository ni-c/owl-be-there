name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # So a dependency advisory published after the last push still reaches
    # someone. Without it `audit` only runs on a change, which is the one moment
    # a new CVE is least likely to have appeared.
    - cron: '0 6 * * 1'

concurrency:
  # The event is part of the key, so a push to main does not cancel the weekly
  # scheduled run on the same ref.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The job names are the required status checks of the `protect-main` ruleset.
# Adding a job is safe; renaming or removing one leaves every pull request
# waiting for a check that no longer exists.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # `--ignore-scripts`: nothing in the tree needs an install hook, and the
      # root `prepare` only points git at .githooks.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # Includes the test and end-to-end trees: Vitest and Playwright transpile
      # rather than typecheck, so nothing else would notice a test that passes
      # the wrong type.
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage
      # The calendar logic again under six time zones, from UTC+14 to UTC-11.
      # A day string turned into a `Date` the wrong way passes in Berlin and
      # fails in Samoa.
      - run: npm run test:tz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # The calendar in real browsers: Chromium and WebKit, each as a desktop with
  # a mouse and as a phone with touch. The paint engine behaves differently
  # under a finger in each engine, so neither stands in for the other.
  e2e:
    runs-on: ubuntu-latest
    # A normal run takes about five minutes; anything near this is stuck.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Keyed on the Playwright version, because that is what decides which
      # browser builds are wanted.
      - id: playwright-version
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # Always this one command: with the browsers cached it only installs the
      # system libraries, which the cache does not hold. A separate
      # `install-deps` step for the cache-hit case hung for over an hour.
      - run: npx playwright install --with-deps chromium chromium-headless-shell webkit
        env:
          DEBIAN_FRONTEND: noninteractive
      - run: npm run build
      - run: npm run test:e2e
      # The README and start page pictures must still be renderable; they are
      # written to a scratch directory here, never committed.
      - name: Render the example screenshots
        run: |
          npm run screenshot -- --out "$RUNNER_TEMP/screenshots"
          for file in screenshot-light.png screenshot-dark.png og.png; do
            test -s "$RUNNER_TEMP/screenshots/$file"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # What a pull request *changes* in the dependency tree, against the advisory
  # database — `npm audit` below sees the tree as it is and cannot tell a bump
  # that introduced a vulnerable release from one that has always been there.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Build tooling (vite, tailwindcss, the test runners) is part of what
          # a pull request can make vulnerable, not only the runtime tree.
          fail-on-scopes: runtime, development

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # An audit has no business running install hooks.
      - run: npm ci --ignore-scripts
      # The whole tree, not `--omit=dev`: what builds the image is part of what
      # ships in it.
      - run: npm audit --audit-level=high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `actions` as well: the workflows run with write tokens on tags and are
      # code like any other.
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript, actions
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, not just the tip: a secret that was committed and
          # removed again is still a secret.
          fetch-depth: 0
          persist-credentials: false
      # The files as they are now.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Pinned: the action's default version was withdrawn upstream once.
          version: v0.73.0
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
      # Every commit on every branch. Trivy only reads the checked-out files;
      # gitleaks walks the history, so a token that was committed and deleted
      # again is found. Pinned by digest.
      - name: Scan the history for secrets
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/repo:ro \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --log-opts=--all /repo

  # Builds the image for both architectures and scans it. A finding is reported
  # as a code scanning alert (which closes itself once a later scan no longer
  # sees it) and then fails the job. The image is not published here; that is
  # the release workflow's job, on a tag.
  container-scan:
    name: container-scan (${{ matrix.tag }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            tag: amd64
          - platform: linux/arm64
            tag: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The Alpine upgrade layer is keyed on the date, so a security fix in the
      # base reaches the image within a day instead of never.
      - id: epoch
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: owl-be-there:scan-${{ matrix.tag }}
          build-args: APK_SECURITY_EPOCH=${{ steps.epoch.outputs.day }}
          cache-from: type=gha,scope=scan-${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=scan-${{ matrix.tag }}
      # Report first, gate second: the report step never fails, so the SARIF is
      # uploaded before the gate can turn the job red.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          image-ref: owl-be-there:scan-${{ matrix.tag }}
          format: sarif
          output: trivy-${{ matrix.tag }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        # Fork pull requests get a read-only token whatever this job asks for.
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          sarif_file: trivy-${{ matrix.tag }}.sarif
          category: trivy-${{ matrix.tag }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          image-ref: owl-be-there:scan-${{ matrix.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
      # The image must start, answer its health check and create an event on a
      # read-only root filesystem, as it will in production. Once per
      # architecture: the arm64 run goes through QEMU and proves the cross-built
      # dependencies really are architecture-independent.
      - name: Smoke-test the container
        run: |
          docker run -d --name owl --platform ${{ matrix.platform }} --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:8080:8080 owl-be-there:scan-${{ matrix.tag }}
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/api/health && break
            sleep 2
          done
          day=$(date -u -d '+7 day' +%F)
          curl -fsS -X POST http://127.0.0.1:8080/api/events \
            -H 'content-type: application/json' \
            -d "{\"title\":\"Smoke\",\"emoji\":\"owl\",\"language\":\"en\",\"durationDays\":1,\"days\":[\"$day\"]}"
          docker exec owl node packages/server/dist/cli.js stats
          docker rm -f owl
