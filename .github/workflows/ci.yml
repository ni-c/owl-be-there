name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Pushes made with the GITHUB_TOKEN, such as the Dependabot auto-merge, start
  # no workflow on main; this lets a maintainer run CI on main by hand.
  workflow_dispatch:
  schedule:
    # So a dependency advisory published after the last push still reaches
    # someone. Without it `audit` only runs on a change, which is the one moment
    # a new CVE is least likely to have appeared.
    - cron: '0 6 * * 1'

concurrency:
  # The event is part of the key, so a push to main does not cancel the weekly
  # scheduled run on the same ref.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The Trivy release every scan runs. Dependabot bumps `uses:` references only,
# never this, so it is a manual bump with two companions: the same version in
# `release.yml` and in the `scan:secrets` image of `package.json`
# (`aquasec/trivy:<version without the v>@<digest>`; renew the multi-arch index
# digest with the version: `docker buildx imagetools inspect aquasec/trivy:<version>`).
env:
  TRIVY_VERSION: v0.73.0

# The job names are the required status checks of the `protect-main` ruleset.
# Adding a job is safe; renaming or removing one leaves every pull request
# waiting for a check that no longer exists.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # `--ignore-scripts`: nothing in the tree needs an install hook, and the
      # root `prepare` only points git at .githooks.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # Includes the test and end-to-end trees: Vitest and Playwright transpile
      # rather than typecheck, so nothing else would notice a test that passes
      # the wrong type.
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage
      # The calendar logic again under five time zones, from UTC+14 to UTC-11.
      # A day string turned into a `Date` the wrong way passes in Berlin and
      # fails in Samoa.
      - run: npm run test:tz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # The calendar in real browsers: Chromium and WebKit, each as a desktop with
  # a mouse and as a phone with touch. The paint engine behaves differently
  # under a finger in each engine, so neither stands in for the other.
  e2e:
    runs-on: ubuntu-latest
    # A normal run takes about five minutes; anything near this is stuck.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Keyed on the Playwright version and the runner image (runner.os is
      # "Linux" on every Ubuntu), because together they decide the browser builds.
      - id: playwright-version
        run: |
          echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.image }}-${{ steps.playwright-version.outputs.version }}
      # Always this one command: with the browsers cached it only installs the
      # system libraries, which the cache does not hold. A separate
      # `install-deps` step for the cache-hit case hung for over an hour.
      - run: npx playwright install --with-deps chromium chromium-headless-shell webkit
        env:
          DEBIAN_FRONTEND: noninteractive
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run test:e2e
      # The README and start page pictures must still be renderable; they are
      # written to a scratch directory here, never committed.
      - name: Render the example screenshots
        run: |
          npm run screenshot -- --out "$RUNNER_TEMP/screenshots"
          for file in screenshot-light.png screenshot-dark.png og.png; do
            test -s "$RUNNER_TEMP/screenshots/$file"
          done
      # Also when the job passes: a test that went green only on its retry
      # leaves the trace of the failed attempt in here.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Advisory: not a required check of `protect-main`, so a red result informs
  # the merge but does not block it.
  # What a pull request *changes* in the dependency tree, against the advisory
  # database — `npm audit` below sees the tree as it is and cannot tell a bump
  # that introduced a vulnerable release from one that has always been there.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Build tooling (vite, tailwindcss, the test runners) is part of what
          # a pull request can make vulnerable, not only the runtime tree.
          fail-on-scopes: runtime, development

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # An audit has no business running install hooks.
      - run: npm ci --ignore-scripts
      # The whole tree, not `--omit=dev`: what builds the image is part of what
      # ships in it.
      - run: npm audit --audit-level=high

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `actions` as well: the workflows run with write tokens on tags and are
      # code like any other.
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript, actions
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, not just the tip: a secret that was committed and
          # removed again is still a secret.
          fetch-depth: 0
          persist-credentials: false
      # The files as they are now.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Pinned: the action's default version was withdrawn upstream once.
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
      # Every commit on every branch. Trivy only reads the checked-out files;
      # gitleaks walks the history, so a token that was committed and deleted
      # again is found. Pinned by digest.
      - name: Scan the history for secrets
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/repo:ro \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --log-opts=--all /repo

  # Builds the image for both architectures and scans it. A finding is reported
  # as a code scanning alert (which closes itself once a later scan no longer
  # sees it) and then fails the job. The image is not published here; that is
  # the release workflow's job, on a tag.
  container-scan:
    name: container-scan (${{ matrix.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            tag: amd64
          - platform: linux/arm64
            tag: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The Alpine upgrade layer is keyed on the date, so a security fix in the
      # base reaches the image within a day instead of never.
      - id: epoch
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: owl-be-there:scan-${{ matrix.tag }}
          build-args: APK_SECURITY_EPOCH=${{ steps.epoch.outputs.day }}
          cache-from: type=gha,scope=scan-${{ matrix.tag }}
          # Pull requests only read the cache: each one writing its own copy
          # filled the 10 GB repository cache.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope=scan-{0}', matrix.tag) || '' }}
      # Report first, gate second: the report step never fails, so the SARIF is
      # uploaded before the gate can turn the job red.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: owl-be-there:scan-${{ matrix.tag }}
          format: sarif
          output: trivy-${{ matrix.tag }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        # Fork pull requests get a read-only token whatever this job asks for.
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          sarif_file: trivy-${{ matrix.tag }}.sarif
          category: trivy-${{ matrix.tag }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: owl-be-there:scan-${{ matrix.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
      # The image must start, answer its health check and create an event on a
      # read-only root filesystem, as it will in production. Once per
      # architecture: the arm64 run goes through QEMU and proves the cross-built
      # dependencies really are architecture-independent.
      - name: Smoke-test the container
        run: |
          docker run -d --name owl --platform ${{ matrix.platform }} --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:8080:8080 owl-be-there:scan-${{ matrix.tag }}
          ready=
          for _ in $(seq 1 60); do
            curl -fsS --max-time 10 http://127.0.0.1:8080/api/health && ready=1 && break
            sleep 2
          done
          test -n "$ready"
          # The static client: the app root with its mount point.
          # The body goes into a variable first: `grep -q` quits at the first
          # match, and the curl on the left of a pipe then fails with exit 23
          # (write error) under pipefail.
          page=$(curl -fsS --max-time 10 http://127.0.0.1:8080/)
          grep -q 'id="root"' <<< "$page"
          day=$(date -u -d '+7 day' +%F)
          # An Arabic and a Japanese title, so the lazily loaded fonts run.
          response=$(curl -fsS --max-time 10 -X POST http://127.0.0.1:8080/api/events \
            -H 'content-type: application/json' \
            -d "{\"title\":\"مرحبا こんにちは\",\"emoji\":\"owl\",\"language\":\"en\",\"durationDays\":1,\"days\":[\"$day\"]}")
          id=$(printf '%s' "$response" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).id)')
          curl -fsS --max-time 60 -o "$RUNNER_TEMP/og.png" "http://127.0.0.1:8080/e/$id/og.png"
          # The PNG signature.
          test "$(head -c 8 "$RUNNER_TEMP/og.png" | od -An -tx1 | tr -d ' \n')" = 89504e470d0a1a0a
          docker exec owl node packages/server/dist/cli.js stats
          # The image's own HEALTHCHECK, not just the endpoint.
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' owl)
            test "$status" = healthy && break
            sleep 2
          done
          test "$status" = healthy
      - name: Container log
        if: failure()
        run: docker logs owl
      - name: Remove the container
        if: always()
        run: docker rm -f owl
