# Do NOT remove the `protect-main` ruleset while this workflow exists:
# `gh pr merge --auto` merges as soon as nothing blocks it, so without required
# checks this would merge every patch bump before a single test has run.
name: Dependabot auto-merge

# Queues low-risk Dependabot updates for merge once CI is green and the pull
# request is approved, so routine bumps need one click instead of three.
#
# Safety rests on two things:
#   * `main` requires the CI checks and a review, so `--auto` waits for both
#     instead of merging immediately.
#   * The condition is written positively: only updates Dependabot explicitly
#     labels patch or minor are queued. Majors — and anything whose update type
#     cannot be determined — stay manual rather than slipping through.
#
# GitHub Actions bumps are excluded for a different reason: they edit files
# under .github/workflows/, and merging those needs the `workflow` scope, which
# the Actions GITHUB_TOKEN can never have. GitHub accepts the queued auto-merge
# and then leaves it pending forever without an error.

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    # Actions bumps never get this job: their pull request runs the proposed
    # workflow code, and this job holds a write token. (A pull request can edit
    # this line too, but not without a diff a reviewer sees.)
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && !github.event.repository.private && !startsWith(github.head_ref, 'dependabot/github_actions/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Queue for merge
        if: |
          steps.metadata.outputs.package-ecosystem != 'github_actions' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
