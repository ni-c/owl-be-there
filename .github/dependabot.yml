version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A release has to be out for a few days before it is proposed: a
    # hijacked package is usually caught and pulled within that time, and
    # patch and minor updates merge on their own once CI passes.
    cooldown:
      default-days: 3
    ignore:
      # typescript-eslint declares `typescript <6.1.0`. A TypeScript major is
      # a decision to make together with the linter, not a weekly bump.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      # Lockstep packages: bumped separately they arrive as individually broken
      # pull requests.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
      # The catch-all has to repeat the patterns above as exclude-patterns.
      # Dependabot documents the first matching group as the winner and does not
      # behave that way (dependabot-core#9765): it once split `vitest` and
      # `@vitest/coverage-v8` across two groups, and the half-update left a
      # lockfile that `npm ci` could not install.
      minor-and-patch:
        exclude-patterns:
          - vitest
          - '@vitest/*'
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
          - tailwindcss
          - '@tailwindcss/*'
        update-types:
          - minor
          - patch

  # Exists so the digest-pinned base image gets refreshed at all. Node majors
  # are excluded: the image has to sit on an LTS line, and roughly half of all
  # Node majors never become one. Crossing a major is a decision, not an update.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A hijacked action is usually withdrawn within days; the pull request's CI
    # runs the new code, so it should not open the hour it is released.
    cooldown:
      default-days: 3
    groups:
      # init and analyze are separate dependencies to Dependabot. Ungrouped, one
      # of them bumps first and the version mismatch fails the CodeQL job.
      codeql:
        patterns:
          - github/codeql-action*
      # The docker/* actions are released in lockstep and used in one job.
      docker:
        patterns:
          - docker/*
