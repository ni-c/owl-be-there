<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--owl:head-->
    <title>Owl Be There — Find a day everyone can make.</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--/owl:head-->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      /*
       * Stamp the theme before the first paint, so a dark-mode reader never
       * sees a flash of the light page. The choice lives in localStorage; the
       * app rewrites it whenever it changes. The `js` class hides the start
       * page's text that the server writes for readers without scripts.
       */
      document.documentElement.classList.add('js');
      (function () {
        try {
          var theme = localStorage.getItem('owl.theme');
          if (theme === '"light"' || theme === '"dark"') {
            document.documentElement.setAttribute(
              'data-theme',
              JSON.parse(theme)
            );
          }
        } catch (error) {
          /* A blocked localStorage is not worth a blank page. */
        }
      })();
      /*
       * Fetch the dictionary of the language the app will start in alongside
       * the app, not after it. The server lists each language's files in
       * #owl-i18n; the choice follows detectLanguage in lib/languageStore.ts:
       * the address, the stored choice, the browser. A wrong guess costs one
       * request, never a wrong language: the app decides for itself.
       */
      (function () {
        try {
          var block = document.getElementById('owl-i18n');
          if (!block) return;
          var files = JSON.parse(block.textContent);
          var known = function (code) {
            return (
              typeof code === 'string' &&
              Object.prototype.hasOwnProperty.call(files, code)
            );
          };
          var path = /^\/([a-z]{2}(?:-[A-Za-z0-9]+)?)\/?$/.exec(
            location.pathname
          );
          var language = path && known(path[1]) ? path[1] : null;
          if (!language) {
            try {
              var stored = JSON.parse(localStorage.getItem('owl.lang'));
              if (known(stored)) language = stored;
            } catch (error) {
              /* Nothing stored, or nothing readable. */
            }
          }
          var tags = navigator.languages || [];
          for (var i = 0; !language && i < tags.length; i++) {
            var tag = String(tags[i]).toLowerCase();
            var base = tag.split('-')[0];
            if (/^zh-(hant|tw|hk|mo)(-|$)/.test(tag)) language = 'zh-Hant';
            else if (tag === 'zh' || /^zh-(hans|cn|sg)(-|$)/.test(tag))
              language = 'zh-Hans';
            else if (/^pt-br(-|$)/.test(tag)) language = 'pt-BR';
            else if (/^es-(?!es(-|$))/.test(tag)) language = 'es-419';
            else if (base === 'no') language = 'nb';
            else if (known(base)) language = base;
          }
          var list = language ? files[language] : [];
          for (var j = 0; j < list.length; j++) {
            var link = document.createElement('link');
            link.rel = 'modulepreload';
            link.crossOrigin = '';
            link.href = list[j];
            document.head.appendChild(link);
          }
        } catch (error) {
          /* A preload is only a head start. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--owl:root--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
